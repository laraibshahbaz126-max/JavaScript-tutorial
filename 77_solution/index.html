<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic website builder</title>
    <style>
.card{
    display: flex;
    border: 2px solid black;
    width: 999px;
    justify-content: center;
    align-items: center;
    padding: 12px;
    margin: 5px;
    background-color: #050404;
    color: white;
    border-radius: 5px;
}
.image img{
    width: 300px;
    border-radius: 5px;
    padding-right: 10px;
}
.text h1, p{
    padding: 2px 0px;
}
.image{
    position: relative;
}
.image .capsule{
    position: absolute;
    bottom: 4px;
    z-index: 10;
    right: 10px;
    background-color: #242020;
    opacity: 0.9;
    color: white;
    padding: 3px;
    border-radius: 3px;
    font-size: 12px;
}
.text h1{
    font-size: larger;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    font-weight: 600;
}

    </style>
</head>
<body>
    <div class="container"></div>
    <div class="card">
        <div class="image">
            <img src="https://i.ytimg.com/vi/tVzUXW6siu0/hqdefault.jpg?sqp=-oaymwEnCPYBEIoBSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLCKktmHuXV_macV6MoUwhKxwzXJ7w"
 alt="">
 <div class="capsule">31:20</div>
        </div>
    <div class="text">
        <h1>Installing VS code & How Websites Work| Sigma Web Development Course-Tutorial#1</h1>
        <p>CodeWithHarry . 8.6M views . 3y ago</p>
    </div>
    </div>
   
        
    <script src="script.js"></script>
</body>
</html>
